<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reset-password</title>
<link rel="stylesheet" href="/assets/original-css/reset-password.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="reset-password-page">
  <div class="reset-password-container">
    <div class="reset-password-card">
      <h1>WISP Management</h1>
      <p class="subtitle">Password Reset</p>

      

      

      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="mode === 'reset'"><div class="form-container">
          <h2>Set New Password</h2>
          <p class="form-description">Enter your new password below</p>

          <div class="form-group">
            <label for="newPassword">New Password <span class="required">*</span></label>
            <input
              id="newPassword"
              type="password"
              placeholder="Enter your new password"
              required
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm your new password"
              required
              minlength="6"
            />
          </div>

          <button 
            type="button" 
            class="btn-primary"
          >
            
              Reset Password
            
          </button>
        </div>
      
        <div class="form-container">
          <h2>Verify Email</h2>
          <p class="form-description">Click the button below to verify your email address</p>

          <button 
            type="button" 
            class="btn-primary"
          >
            
              Verify Email
            
          </button>
        </div></div>

      <div class="form-footer">
        <a href="/login" class="link">Back to Login</a>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/reset-password"}</script>

</body>
</html>
