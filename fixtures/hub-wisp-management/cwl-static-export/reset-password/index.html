<div class="wisp-app-surface" data-wisp-page="reset-password" data-wisp-path="/reset-password" data-cwl-island="client"><div class="reset-password-page">
  <div class="reset-password-container">
    <div class="reset-password-card">
      <h1>WISP Management</h1>
      <p class="subtitle">Password Reset</p>

      <div data-cwl-bind="if" data-cwl-hole-detail="mode === 'reset'" hidden aria-hidden="true">
        <div class="form-container">
          <h2>Set New Password</h2>
          <p class="form-description">Enter your new password below</p>

          <div class="form-group">
            <label for="newPassword">New Password <span class="required">*</span></label>
            <input
              id="newPassword"
              type="password"
              placeholder="Enter your new password" data-cwl-attr-disabled="isLoading"
              required
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm your new password" data-cwl-attr-disabled="isLoading"
              required
              minlength="6"
            />
          </div>

          <button
            type="button"
            class="btn-primary" data-cwl-action="handlePasswordReset" data-cwl-attr-disabled="isLoading || !newPassword || !confirmPassword"
           aria-label="Password Reset">

              Reset Password

              <div hidden aria-hidden="true"><span class="spinner"></span>
              Resetting...
            </div>
          </button>
        </div>
      </div><div data-cwl-bind="if" data-cwl-hole-detail="mode === 'verify'" hidden aria-hidden="true">
        <div class="form-container">
          <h2>Verify Email</h2>
          <p class="form-description">Click the button below to verify your email address</p>

          <button
            type="button"
            class="btn-primary" data-cwl-action="handleEmailVerification" data-cwl-attr-disabled="isLoading"
           aria-label="Email Verification">

              Verify Email

              <div hidden aria-hidden="true"><span class="spinner"></span>
              Verifying...
            </div>
          </button>
        </div>
      </div><div data-cwl-bind="if" data-cwl-hole-detail="!actionCode"><div class="form-container">
          <p class="error-text">Invalid reset link. Please request a new password reset email.</p>
          <button
            type="button"
            class="btn-primary" data-cwl-nav="/login"
          >
            Go to Login
          </button>
        </div></div>

      <div class="form-footer">
        <a href="/login" class="link">Back to Login</a>
      </div>
    </div>
  </div>
</div></div>
<script type="application/json" id="cwl-page-load">{"source":"origin-convert-all","httpPath":"/reset-password"}</script>
