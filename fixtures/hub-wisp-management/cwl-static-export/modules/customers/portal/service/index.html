<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service</title>
<link rel="stylesheet" href="/assets/original-css/modules_customers_portal_service.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="service-page">
    <p class="back-link"><a href="/modules/customers/portal/dashboard">← Back to Dashboard</a></p>
    <h1>Service Information</h1>
    
    <div class="service-details">
      <div class="info-section">
        <h2>Service Status</h2>
        <div class="info-card">
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="info-value status-">
              active
            </span>
          </div>
          <div class="info-row">
              <span class="info-label">Service Plan:</span>
              <span class="info-value">Residential 100</span>
            </div>
        </div>
      </div>
      
      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="serviceInfo?.serviceAddress"><div class="info-section">
          <h2>Service Address</h2>
          <div class="info-card">
            <div class="info-row">
              <span class="info-label">Address:</span>
              <span class="info-value">
                
                ,  
              </span>
            </div>
          </div>
        </div></div>
      
      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="serviceInfo?.equipment && serviceInfo.equipment.length > 0"><div class="info-section">
          <h2>Equipment</h2>
          <div class="equipment-list">
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="serviceInfo.equipment as equipment"><div class="equipment-card">
                <div class="equipment-header">
                  <span class="equipment-type"></span>
                  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="equipment.serialNumber"><span class="equipment-serial">SN: </span></div>
                </div>
                <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="equipment.model"><div class="equipment-detail">Model: </div></div>
                <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="equipment.installDate"><div class="equipment-detail">
                    Installed: 
                  </div></div>
              </div></div>
          </div>
        </div></div>
    </div>
  </div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/modules/customers/portal/service","apiPath":"/api/customers","api_ok":true,"api_surface":"wisp-api-native","api_resource":"customers","api_op":"list","tracedApiStatus":200}</script>

</body>
</html>
