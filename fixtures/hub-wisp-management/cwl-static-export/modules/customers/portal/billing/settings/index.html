<div class="wisp-app-surface" data-wisp-page="customers" data-wisp-path="/modules/customers/portal/billing/settings" data-cwl-island="client"><div class="billing-settings-page">
    <h1>Billing settings</h1>
    <p class="subtitle">Payment method and invoice preferences</p>

      <div class="message error" hidden aria-hidden="true"></div>

      <div class="message success" hidden aria-hidden="true"></div>

    <form data-cwl-on-submit="action:handleSave" class="settings-form">

      <section class="settings-section">
        <h2>Invoice delivery</h2>
        <p class="hint">How you want to receive invoices.</p>
        <label>
          <input type="radio" value="email" />
          Email only
        </label>
        <label>
          <input type="radio" value="portal" />
          Portal only (view in Billing page)
        </label>
        <label>
          <input type="radio" value="both" />
          Both email and portal
        </label>
      </section>

      <section class="settings-section read-only">
        <h2>Invoice format</h2>
        <p class="hint">Set by your provider (read-only).</p>
        <div class="info-rows">
          <div class="info-row">
            <span class="label">Company name</span>
            <span class="value"><span data-cwl-bind="interp" data-cwl-hole-detail="invoiceFormat.companyName || '—'"></span></span>
          </div>
          <div class="info-row">
            <span class="label">Payment due (days)</span>
            <span class="value"><span data-cwl-bind="interp" data-cwl-hole-detail="invoiceFormat.dueDays"></span></span>
          </div>
          <div class="info-row">
            <span class="label">Currency</span>
            <span class="value"><span data-cwl-bind="interp" data-cwl-hole-detail="invoiceFormat.currency"></span></span>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="submit" class="btn-primary" data-cwl-attr-disabled="saving">
          Save settings
        </button>
        <a href="/modules/customers/portal/billing" class="btn-secondary">Back to Billing</a>
      </div>
    </form>
  </div></div>
<script type="application/json" id="cwl-page-load">{"source":"origin-convert-all","httpPath":"/modules/customers/portal/billing/settings"}</script>
