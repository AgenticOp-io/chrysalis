<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>signup</title>
<link rel="stylesheet" href="/assets/original-css/modules_customers_portal_signup.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="signup-page">
  <div class="signup-container">
    <div class="signup-header">
      
      <h2>Create Account</h2>
      <p class="signup-subtitle">Link your customer account to access the portal</p>
    </div>
    
    
      <form class="signup-form">
        
        
        <div class="form-group">
          <label for="customerId">Customer ID</label>
          <input
            id="customerId"
            type="text"
            placeholder="Enter your customer ID"
            required
          />
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            id="phone"
            type="tel"
            placeholder="Enter your phone number"
            required
          />
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Create a password (min 6 characters)"
            required
            minlength="6"
          />
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            required
          />
        </div>
        
        <button type="submit" class="btn-primary">
          Create Account
        </button>
        
        <div class="signup-links">
          <a href="/modules/customers/portal/login" class="link">Already have an account? Sign in</a>
        </div>
      </form>
    
  </div>
</div>

</body>
</html>
