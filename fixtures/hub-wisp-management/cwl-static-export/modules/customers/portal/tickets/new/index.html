<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>new</title>
<link rel="stylesheet" href="/assets/original-css/modules_customers_portal_tickets_new.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="ticket-details-page">
    <div class="page-header">
      <a href="/modules/customers/portal/tickets" class="back-link">← Back to Tickets</a>
      <h1>Ticket Details</h1>
    </div>
    
    <div class="ticket-details">
      <div class="ticket-header">
        <div>
          <span class="ticket-number">N/A</span>
          <span 
            class="ticket-status" 
            style="background:"
          >
            <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="ticket.status"></span>
          </span>
        </div>
        <div class="ticket-meta">
          <span>Priority: <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="ticket.priority"></span></span>
          <span>Created: <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="new Date(ticket.createdAt || '').toLocaleDateString()"></span></span>
        </div>
      </div>
      
      <div class="ticket-content">
        <h2><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="ticket.title"></span></h2>
        <p class="ticket-description">No description</p>
      </div>
      
      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="ticket.workPerformed && ticket.workPerformed.length > 0"><div class="ticket-history">
          <h3>Ticket History</h3>
          <div class="history-list">
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="ticket.workPerformed as work"><div class="history-item">
                <div class="history-header">
                  <span class="history-action"></span>
                  <span class="history-date">
                    
                  </span>
                </div>
                <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="work.performedByName"><div class="history-performer">
                    By: 
                  </div></div>
                <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="work.notes"><div class="history-notes"></div></div>
              </div></div>
          </div>
        </div></div>
      
      <div class="add-comment">
        <h3>Add Comment</h3>
        <form>
          <textarea
            placeholder="Add a comment or update..."
            rows="4"
          ></textarea>
          <button type="submit" class="btn-primary">
            Add Comment
          </button>
        </form>
      </div>
    </div>
  </div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/modules/customers/portal/tickets/:id","apiPath":"/api/customers","api_ok":true,"api_surface":"wisp-api-native","api_resource":"customers","api_op":"list","tracedApiStatus":200}</script>

</body>
</html>
