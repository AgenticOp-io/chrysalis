<div class="wisp-app-surface" data-wisp-page="modules-inventory-:id-edit" data-wisp-path="/modules/inventory/:id/edit" data-cwl-island="client"><div class="edit-page">
  <div class="page-header">
    <div class="header-left">
      <button class="back-btn">
        ← Back to Details
      </button>
      <h1>✏️ Edit Equipment</h1>
      
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary">
        Cancel
      </button>
      <button class="btn btn-primary">
        Save Changes
      </button>
    </div>
  </div>

  
    <form class="edit-form">
      <div class="form-sections">
        <!-- Basic Information -->
        <div class="form-section">
          <h3>📋 Basic Information</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="assetTag">Asset Tag</label>
              <input 
                id="assetTag"
                type="text" 
                placeholder="Enter asset tag"
              />
            </div>
            
            <div class="form-group">
              <label for="serialNumber">Serial Number *</label>
              <input 
                id="serialNumber"
                type="text" 
                placeholder="Enter serial number"
                required
              />
            </div>
            
            <div class="form-group">
              <label for="category">Category *</label>
              <select id="category" required>
                <option>Select category...</option>
                <option value="radio">Radio Equipment</option>
                <option value="antenna">Antenna</option>
                <option value="cpe">CPE Device</option>
                <option value="backhaul">Backhaul Equipment</option>
                <option value="power">Power Equipment</option>
                <option value="network">Network Equipment</option>
                <option value="test">Test Equipment</option>
                <option value="other">Other</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="equipmentType">Equipment Type *</label>
              <input 
                id="equipmentType"
                type="text" 
                placeholder="e.g., Sector Antenna, CPE Router"
                required
              />
            </div>
            
            <div class="form-group">
              <label for="manufacturer">Manufacturer</label>
              <input 
                id="manufacturer"
                type="text" 
                placeholder="Enter manufacturer"
              />
            </div>
            
            <div class="form-group">
              <label for="model">Model</label>
              <input 
                id="model"
                type="text" 
                placeholder="Enter model"
              />
            </div>
            
            <div class="form-group">
              <label for="status">Status *</label>
              <select id="status" required>
                <option value="available">Available</option>
                <option value="deployed">Deployed</option>
                <option value="reserved">Reserved</option>
                <option value="in-transit">In Transit</option>
                <option value="maintenance">Maintenance</option>
                <option value="rma">RMA</option>
                <option value="retired">Retired</option>
                <option value="lost">Lost</option>
                <option value="sold">Sold</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="condition">Condition *</label>
              <select id="condition" required>
                <option value="new">New</option>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="poor">Poor</option>
                <option value="damaged">Damaged</option>
                <option value="refurbished">Refurbished</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Current Location (optional; assign during deploy if unassigned) -->
        <div class="form-section">
          <h3>📍 Current Location</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="locationType">Location Type</label>
              <select id="locationType">
                <option value="unassigned">Unassigned (assign during deploy)</option>
                <option value="warehouse">Warehouse</option>
                <option value="tower">Tower Site</option>
                <option value="noc">NOC</option>
                <option value="vehicle">Vehicle</option>
                <option value="customer">Customer Site</option>
                <option value="rma">RMA</option>
                <option value="vendor">Vendor</option>
                <option value="other">Other</option>
              </select>
            </div>
            
            
          </div>
        </div>

        <!-- Purchase Information -->
        <div class="form-section">
          <h3>💰 Purchase Information</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="vendor">Vendor</label>
              <input 
                id="vendor"
                type="text" 
                placeholder="Enter vendor name"
              />
            </div>
            
            <div class="form-group">
              <label for="purchaseDate">Purchase Date</label>
              <input 
                id="purchaseDate"
                type="date" 
              />
            </div>
            
            <div class="form-group">
              <label for="purchasePrice">Purchase Price</label>
              <input 
                id="purchasePrice"
                type="number" 
                step="0.01" 
                placeholder="0.00"
              />
            </div>
            
            <div class="form-group">
              <label for="purchaseOrderNumber">PO Number</label>
              <input 
                id="purchaseOrderNumber"
                type="text" 
                placeholder="Enter PO number"
              />
            </div>
          </div>
        </div>

        <!-- Warranty Information -->
        <div class="form-section">
          <h3>🛡️ Warranty Information</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="warrantyProvider">Provider</label>
              <input 
                id="warrantyProvider"
                type="text" 
                placeholder="Enter warranty provider"
              />
            </div>
            
            <div class="form-group">
              <label for="warrantyStartDate">Start Date</label>
              <input 
                id="warrantyStartDate"
                type="date" 
              />
            </div>
            
            <div class="form-group">
              <label for="warrantyEndDate">End Date</label>
              <input 
                id="warrantyEndDate"
                type="date" 
              />
            </div>
            
            <div class="form-group">
              <label for="warrantyType">Type</label>
              <input 
                id="warrantyType"
                type="text" 
                placeholder="e.g., Manufacturer, Extended"
              />
            </div>
          </div>
        </div>

        <!-- Technical Specifications -->
        <div class="form-section">
          <h3>⚙️ Technical Specifications</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="powerRequirements">Power Requirements</label>
              <input 
                id="powerRequirements"
                type="text" 
                placeholder="e.g., 24V DC, 2A"
              />
            </div>
            
            <div class="form-group">
              <label for="ipAddress">IP Address</label>
              <input 
                id="ipAddress"
                type="text" 
                placeholder="192.168.1.100"
              />
            </div>
            
            <div class="form-group">
              <label for="managementUrl">Management URL</label>
              <input 
                id="managementUrl"
                type="url" 
                placeholder="http://192.168.1.100"
              />
            </div>
          </div>
        </div>

        <!-- Notes -->
        <div class="form-section">
          <h3>📝 Notes</h3>
          <div class="form-group">
            <label for="notes">Additional Notes</label>
            <textarea 
              id="notes" 
              placeholder="Enter any additional notes or comments..."
              rows="4"
            ></textarea>
          </div>
        </div>
      </div>
    </form>
  
</div></div>
<script type="application/json" id="cwl-page-load">{"source":"origin-convert-all","path":"/modules/inventory/:id/edit","apiPath":"/api/inventory","api_ok":true,"api_surface":"wisp-api-native","api_resource":"inventory","api_op":"list","tracedApiStatus":200}</script>
