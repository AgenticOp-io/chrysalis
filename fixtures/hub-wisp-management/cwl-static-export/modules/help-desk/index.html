<div class="help-desk-container">
  <div class="header">
    <button class="btn-back">
      ← Back to Modules
    </button>
    
    <div class="title-section">
      <h1>🎧 Help Desk</h1>
      <p class="subtitle">Customer support and ticket management for Demo Tenant</p>
    </div>
    
    <div class="header-actions">
      <button 
        class="btn btn-secondary btn-reports"
        title="View Ticket Reports and Analytics"
      >
        📊 Reports
      </button>
      <button class="btn btn-secondary">
        🔍 Customer Lookup
      </button>
      <button class="btn btn-primary">
        ➕ Create Ticket
      </button>
    </div>
  </div>
  
  
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon open">📋</div>
      <div class="stat-content">
        <div class="stat-value"></div>
        <div class="stat-label">Open Tickets</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon in-progress">⚙️</div>
      <div class="stat-content">
        <div class="stat-value"></div>
        <div class="stat-label">In Progress</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon resolved">✅</div>
      <div class="stat-content">
        <div class="stat-value"></div>
        <div class="stat-label">Resolved</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon time">⏱️</div>
      <div class="stat-content">
        <div class="stat-value"></div>
        <div class="stat-label">Avg Resolution</div>
      </div>
    </div>
  </div>
  
  <div class="filters">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        placeholder="Search tickets, customers..."
      />
    </div>
    
    <select class="select">
      <option value="all">All Status</option>
      <option value="open">Open</option>
      <option value="assigned">Assigned</option>
      <option value="in-progress">In Progress</option>
      <option value="waiting-parts">Waiting Parts</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
    </select>
    
    <select class="select">
      <option value="all">All Priority</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    
    <select class="select">
      <option value="all">All Categories</option>
      <option value="customer-facing">Customer-Facing</option>
      <option value="infrastructure">Infrastructure</option>
    </select>
    
    <div class="results-count">
       of 1 tickets
    </div>
  </div>
