<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>user-management</title>
<link rel="stylesheet" href="/assets/original-css/modules_user-management.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="user-management-container">
  <div class="header">
    <button class="btn-back">
      ← Back to Modules
    </button>
    
    <div class="title-section">
      <h1>👥 User Management</h1>
      <p class="subtitle">
        
          Manage all users across all organizations
        
      </p>
    </div>
    
    
  </div>

  

  <div class="filters">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        placeholder="Search by name or email..."
      />
    </div>

    <select class="select">
      <option value="all">All Roles</option>
      <option value="owner">Owner</option>
      <option value="admin">Admin</option>
      <option value="engineer">Engineer</option>
      <option value="installer">Field Technician</option>
      <option value="helpdesk">Help Desk</option>
      <option value="viewer">Viewer</option>
    </select>

    <select class="select">
      <option value="all">All Status</option>
      <option value="active">Active</option>
      <option value="suspended">Suspended</option>
      <option value="pending_invitation">Pending</option>
    </select>

    <div class="results-count">
      <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="filteredUsers.length"></span> of 2 users
    </div>
  </div>

  
    <div class="table-container">
      <table class="user-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Last Login</th>
            <th>Added</th>
            
          </tr>
        </thead>
        <tbody>
          <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="filteredUsers as user (user.uid)"><tr>
              <td>
                <div class="user-cell">
                  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="user.photoURL"><img class="user-avatar" /></div>
                  <div class="user-info">
                    <div class="user-name"></div>
                    <div class="user-email"></div>
                  </div>
                </div>
              </td>
              <td>
                <span class="badge ">
                  
                </span>
              </td>
              <td>
                <span class="badge ">
                  
                </span>
              </td>
              <td class="time-cell">
                
              </td>
              <td class="time-cell">
                
              </td>
              
            </tr></div>
        </tbody>
      </table>
    </div>
  
</div>




<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/modules/user-management","apiPath":"/api/users","api_ok":true,"api_surface":"wisp-api-native","api_resource":"users","api_op":"list","tracedApiStatus":200}</script>

</body>
</html>
