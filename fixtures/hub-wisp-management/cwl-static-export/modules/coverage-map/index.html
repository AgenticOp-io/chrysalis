      <div class="plan-summary-grid">
        <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="Object.entries(displayPlanSummary.byType ?? ) as [type, count]"><div class="plan-summary-item">
            <span class="label"></span>
            <span class="value"></span>
          </div></div>
      </div>
    </div></div>
