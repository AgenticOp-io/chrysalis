<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alerts</title>
<link rel="stylesheet" href="/assets/original-css/modules_acs-cpe-management_alerts.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="alerts-page">
  <nav class="cwl-nav-shell" data-cwl-nav-shell="MainMenu" aria-hidden="true"></nav>
  
  <div class="page-header">
    <div class="header-content">
      <a href="/modules/acs-cpe-management" class="back-button">← Back to ACS Management</a>
      <h1>🚨 Alert Rules</h1>
      <p>Configure alerts for ACS device monitoring</p>
    </div>
    <button class="btn btn-primary">
      ➕ Create Alert Rule
    </button>
  </div>

  

  

  <!-- Active Alerts -->
  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="alerts.length > 0"><div class="alerts-section">
      <h2>Active Alerts (<span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="alerts.length"></span>)</h2>
      <div class="alerts-list">
        <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="alerts as alert"><div class="alert-item" style="border-left-color: ">
            <div class="alert-header">
              <span class="alert-severity" style="color: ">
                
              </span>
              <span class="alert-time"></span>
            </div>
            <div class="alert-message"></div>
            <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="alert.device_name"><div class="alert-device">Device: </div></div>
            <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="alert.current_value !== undefined"><div class="alert-value">Current Value: </div></div>
          </div></div>
      </div>
    </div></div>

  <!-- Alert Rules -->
  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="isLoading && rules.length === 0"><div class="loading">Loading alert rules...</div>
  
    <div class="empty-state">
      <p>No alert rules found. Create your first alert rule to get started.</p>
      <button class="btn btn-primary">Create Alert Rule</button>
    </div></div>
</div>

<!-- Create/Edit Modal -->

</body>
</html>
