<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faults</title>
<link rel="stylesheet" href="/assets/original-css/modules_acs-cpe-management_faults.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="faults-page">
  <!-- Main Navigation -->
  <nav class="cwl-nav-shell" data-cwl-nav-shell="MainMenu" aria-hidden="true"></nav>
  
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <div class="header-top">
        <a href="/dashboard" class="back-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          ← Back to Dashboard
        </a>
      </div>
      <h1 class="page-title">
        <span class="page-icon">⚠️</span>
        Device Faults
      </h1>
      <p class="page-description">
        Monitor and manage device faults and errors
      </p>
    </div>
    <div class="header-actions">
      <a href="/modules/acs-cpe-management/admin/database" class="btn btn-secondary">
        <span class="btn-icon">🗂️</span>
        Initialize Faults in Database
      </a>
      <button class="btn btn-primary">
        <span class="btn-icon">🔄</span>
        Refresh
      </button>
    </div>
  </div>

  <!-- Fault Statistics -->
  <div class="stats-section">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-content">
          <div class="stat-number">4</div>
          <div class="stat-label">Total Faults</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🔴</div>
        <div class="stat-content">
          <div class="stat-number">2</div>
          <div class="stat-label">Open</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🟢</div>
        <div class="stat-content">
          <div class="stat-number">2</div>
          <div class="stat-label">Resolved</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🚨</div>
        <div class="stat-content">
          <div class="stat-number">1</div>
          <div class="stat-label">Critical</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-section">
    <div class="filter-group">
      <input 
        type="text" 
        placeholder="Search faults..."
        class="search-input"
      />
    </div>
    <div class="filter-group">
      <select class="filter-select">
        <option value="all">All Severities</option>
        <option value="Critical">Critical</option>
        <option value="Warning">Warning</option>
        <option value="Info">Info</option>
      </select>
    </div>
    <div class="filter-group">
      <select class="filter-select">
        <option value="all">All Status</option>
        <option value="Open">Open</option>
        <option value="Resolved">Resolved</option>
      </select>
    </div>
  </div>

  <!-- Faults List -->
  <div class="faults-container">
    
      <div class="faults-list">
        <div class="fault-card">
            <div class="fault-header">
              <div class="fault-info">
                <h3 class="fault-id"></h3>
                <p class="fault-device"></p>
              </div>
              <div class="fault-badges">
                <span class="severity-badge">
                  
                </span>
                <span class="status-badge">
                  
                </span>
              </div>
            </div>
            
            <div class="fault-content">
              <div class="fault-message">
                <strong>Error :</strong> 
              </div>
              <div class="fault-description">
                
              </div>
              <div class="fault-meta">
                <span class="meta-item">
                  <strong>Timestamp:</strong> 
                </span>
                
              </div>
            </div>
            
            <div class="fault-actions">
              <button class="btn btn-sm btn-primary">
                View Details
              </button>
              
              <button class="btn btn-sm btn-danger">
                🗑️ Delete
              </button>
            </div>
          </div>
      </div>
    
  </div>
</div>

<!-- Fault Details Modal -->

<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/modules/acs-cpe-management/faults","apiPath":"/api/snmp","api_ok":true,"api_surface":"wisp-api-native","api_resource":"snmp-monitoring","api_op":"list","tracedApiStatus":200}</script>

</body>
</html>
