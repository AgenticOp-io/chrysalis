<div class="wisp-app-surface" data-wisp-page="modules-tenant-management-users" data-wisp-path="/modules/tenant-management/users" data-cwl-island="client"><div class="users-page">
  <div class="page-header">
    <div>
      <button class="back-btn">
        ← Back to Tenant Settings
      </button>
      <h1>👥 User Management</h1>
      <p class="subtitle"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="tenantName"></span></p>
    </div>

    <div class="header-buttons">
      <button class="btn-primary">
        <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="showAddUserForm ? '✕ Cancel' : '➕ Add User'"></span>
      </button>
    </div>
  </div>

  

  

  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="showAddUserForm"><div class="invite-form">
      <h2>Add User to Organization</h2>
      <p class="form-subtitle">Add an existing user or create a placeholder for a future user</p>
      
      <div class="form-group">
        <label for="user-email">Email Address</label>
        <input
          id="user-email"
          type="email"
          placeholder="user@example.com"
        />
        <p class="help-text">User will be granted access to this organization</p>
      </div>

      <div class="form-group">
        <label for="user-role">Role</label>
        <select id="user-role">
          <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="roleOptions as role"><option>
               - 
            </option></div>
        </select>
        <p class="help-text">Determines what this user can do in the organization</p>
      </div>

      <div class="form-actions">
        <button class="btn-secondary">
          Cancel
        </button>
        <button class="btn-primary">
          <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="isAdding ? 'Adding...' : 'Add User'"></span>
        </button>
      </div>
    </div></div>

  <div class="users-section">
    <h2>Organization Users (<span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="users.length"></span>)</h2>

    
      <div class="users-table">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Role</th>
              <th>Added</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="users as user"><tr>
                <td>
                  <div class="user-cell">
                    <span class="user-icon">👤</span>
                    <span></span>
                  </div>
                </td>
                <td>
                  <select>
                    <option value="owner">Owner</option>
                    <option value="admin">Admin</option>
                    <option value="operator">Operator</option>
                    <option value="viewer">Viewer</option>
                  </select>
                </td>
                <td>
                  
                </td>
                <td>
                  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="user.role !== 'owner'"><button 
                      class="btn-danger-small"
                    >
                      Remove
                    </button></div>
                </td>
              </tr></div>
          </tbody>
        </table>
      </div>
    
  </div>
</div></div>
<script type="application/json" id="cwl-page-load">{"source":"origin-convert-all","path":"/modules/tenant-management/users"}</script>
