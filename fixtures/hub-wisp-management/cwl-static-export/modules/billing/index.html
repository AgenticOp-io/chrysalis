<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>billing</title>
<link rel="stylesheet" href="/assets/original-css/modules_billing.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="billing-module">
    <!-- Header -->
    <div class="module-header">
      <div class="header-content">
        <button class="back-btn">
          <span class="back-icon">←</span>
          Back to Dashboard
        </button>
        <div class="module-title">
          <h1>💳 Billing & Subscriptions</h1>
          <p>Manage your subscription and billing information</p>
        </div>
        <div class="tenant-info">
          <span class="tenant-name">Demo Tenant</span>
            <span class="tenant-subdomain"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="$currentTenant.subdomain"></span></span>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="module-content">
      

      
        <!-- Current Subscription -->
        <div class="current-subscription">
          <h2>Current Subscription</h2>
          
        </div>

        <!-- Available Plans -->
        <div class="plans-section">
          <h2>Available Plans</h2>
          <div class="plans-grid">
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="plans as plan"><div class="plan-card ">
                <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="plan.isPopular"><div class="popular-badge">Most Popular</div></div>
                <div class="plan-header">
                  <h3></h3>
                  <div class="plan-price">
                    <span class="price"></span>
                    <span class="interval">/</span>
                  </div>
                </div>
                <p class="plan-description"></p>
                <ul class="plan-features">
                  <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="plan.features as feature"><li>✓ </li></div>
                </ul>
                <div class="plan-limits">
                  <span>Up to  users</span>
                </div>
                <button 
                  class="select-plan-btn">
                  
                </button>
              </div></div>
          </div>
        </div>

        <!-- Payment Methods -->
        <div class="payment-methods-section">
          <h2>Payment Methods</h2>
          
        </div>

        <!-- Recent Invoices -->
        <div class="invoices-section">
          <h2>Recent Invoices</h2>
          
        </div>
      
    </div>

    <!-- Edit Payment Method Modal -->
    
  </div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/modules/billing","apiPath":"/api/customer-billing","api_ok":true,"api_surface":"wisp-api-native","api_resource":"customer-billing","api_op":"list","tracedApiStatus":200}</script>

</body>
</html>
