<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>support-dashboard</title>
<link rel="stylesheet" href="/assets/original-css/support-dashboard.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="support-dashboard">
    <header class="dashboard-header">
      <div class="header-content">
        <h1>🎧 Customer Support Dashboard</h1>
        <p class="subtitle"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="tenantName"></span> - Support Portal</p>
      </div>
      <div class="header-actions">
        <button class="btn-secondary">
          ⚙️ Portal Settings
        </button>
      </div>
    </header>

    
      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card alerts">
          <div class="stat-icon">🚨</div>
          <div class="stat-content">
            <div class="stat-value"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="stats.activeAlerts"></span></div>
            <div class="stat-label">Active Alerts</div>
          </div>
        </div>
        
        <div class="stat-card tickets">
          <div class="stat-icon">🎫</div>
          <div class="stat-content">
            <div class="stat-value"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="stats.pendingTickets"></span></div>
            <div class="stat-label">Pending Tickets</div>
          </div>
        </div>
        
        <div class="stat-card chats">
          <div class="stat-icon">💬</div>
          <div class="stat-content">
            <div class="stat-value"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="stats.openChats"></span></div>
            <div class="stat-label">Open Chats</div>
          </div>
        </div>
        
        <div class="stat-card customers">
          <div class="stat-icon">👥</div>
          <div class="stat-content">
            <div class="stat-value"><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="stats.totalCustomers"></span></div>
            <div class="stat-label">Customers</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions-grid">
          <button class="action-card">
            <span class="action-icon">🚨</span>
            <span class="action-label">Manage Alerts</span>
          </button>
          
          <button class="action-card">
            <span class="action-icon">❓</span>
            <span class="action-label">Edit FAQ</span>
          </button>
          
          <button class="action-card">
            <span class="action-icon">📚</span>
            <span class="action-label">Knowledge Base</span>
          </button>
          
          <button class="action-card">
            <span class="action-icon">💬</span>
            <span class="action-label">Chat Settings</span>
          </button>
          
          <button class="action-card">
            <span class="action-icon">🎫</span>
            <span class="action-label">Help Desk</span>
          </button>
          
          <button class="action-card">
            <span class="action-icon">👥</span>
            <span class="action-label">Customers</span>
          </button>
        </div>
      </div>

      <!-- Active Alerts Section -->
      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="activeAlerts.length > 0"><div class="section">
          <div class="section-header">
            <h2>🚨 Active Alerts</h2>
            <button class="btn-link">
              Manage All →
            </button>
          </div>
          <div class="alerts-list">
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="activeAlerts as alert"><div class="alert-item ">
                <span class="alert-icon"></span>
                <div class="alert-content">
                  <h4></h4>
                  <p></p>
                </div>
                <span class="alert-status"></span>
              </div></div>
          </div>
        </div></div>

      <!-- Recent Tickets Section -->
      <div class="section">
        <div class="section-header">
          <h2>🎫 Recent Support Tickets</h2>
          <button class="btn-link">
            View All →
          </button>
        </div>
        
        <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="recentTickets.length === 0"><div class="empty-state">
            <p>No recent tickets</p>
          </div></div>
      </div>
    
  </div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/support-dashboard"}</script>

</body>
</html>
