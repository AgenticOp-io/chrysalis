<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>debug-tenants</title>
<link rel="stylesheet" href="/assets/original-css/debug-tenants.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="debug-container">
  <h1>Tenant Debug Information</h1>
  
  <div class="debug-section">
    <h2>Authentication Status</h2>
    <p><strong>Is Authenticated:</strong> <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="debugInfo.isAuthenticated"></span></p>
    <p><strong>User Email:</strong> <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="debugInfo.currentUser?.email || 'None'"></span></p>
    <p><strong>User UID:</strong> <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="debugInfo.currentUser?.uid || 'None'"></span></p>
  </div>

  <div class="debug-section">
    <h2>Tenant Store State</h2>
    <pre><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="JSON.stringify(debugInfo.tenantState, null, 2)"></span></pre>
  </div>

  <div class="debug-section">
    <h2>User Tenants (Direct API Call)</h2>
    <p><strong>Count:</strong> <span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="debugInfo.userTenants.length"></span></p>
    <pre><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="JSON.stringify(debugInfo.userTenants, null, 2)"></span></pre>
  </div>

  <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="debugInfo.error"><div class="debug-section error">
      <h2>Error</h2>
      <p><span data-cwl-hole="legacy:markup-lift-svelte-interp" data-cwl-hole-detail="debugInfo.error"></span></p>
    </div></div>
</div>
<script type="application/json" id="cwl-page-load">{"source":"wisp-m31","path":"/debug-tenants"}</script>

</body>
</html>
