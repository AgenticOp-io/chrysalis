<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>system-management</title>
<link rel="stylesheet" href="/assets/original-css/admin_system-management.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">

<body>
<div class="system-admin-page">
    <nav class="cwl-nav-shell" data-cwl-nav-shell="AdminBreadcrumb" aria-hidden="true"></nav>
    <div class="admin-header">
      <h1>🔧 System Administration</h1>
      <p>Manage all tenants and system settings</p>
    </div>

    

    <div class="admin-content">
      <div class="tenants-list">
        <h2>All Tenants (2)</h2>
        
        
      </div>

      
    </div>

    <!-- Remote Agents Status Section (Global/System-wide) -->
    <div class="remote-agents-section">
      <div class="section-header">
        <h2>📡 Remote Agents Status (System-wide)</h2>
        <button class="btn btn-secondary">
          Refresh
        </button>
      </div>

        
          <div class="agents-table-container">
            <table class="agents-table">
              <thead>
                <tr>
                  <th>Tenant</th>
                  <th>Type</th>
                  <th>ID</th>
                  <th>Name/Code</th>
                  <th>First Check-in</th>
                  <th>Last Check-in</th>
                  <th>Status</th>
                  <th>Hardware Linked</th>
                </tr>
              </thead>
              <tbody>
                <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="remoteAgents as agent (agent.epc_id || agent.device_id)"><tr>
                    <td>
                      <strong></strong>
                    </td>
                    <td>
                      <span class="agent-type-badge type-">
                        
                      </span>
                    </td>
                    <td>
                      <code></code>
                    </td>
                    <td>
                      
                    </td>
                    <td></td>
                    <td>
                      
                      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="agent.time_since_checkin !== null && agent.time_since_checkin !== undefined"><br>
                        <small class="time-ago"></small></div>
                    </td>
                    <td>
                      <span class="status-badge status-">
                        
                      </span>
                    </td>
                    <td>
                      <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="agent.hardware_linked"><span class="linked-badge linked">✓ Linked</span>
                        <div data-cwl-hole="legacy:markup-lift-svelte-if" data-cwl-hole-detail="agent.hardware_link_type"><br><small>()</small></div></div>
                    </td>
                  </tr></div>
              </tbody>
            </table>
          </div>
        
      </div>

    
  </div>

</html>
