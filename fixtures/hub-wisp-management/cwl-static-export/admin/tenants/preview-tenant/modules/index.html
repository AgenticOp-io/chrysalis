<div class="wisp-app-surface" data-wisp-page="admin-tenants-:tenantId-modules" data-wisp-path="/admin/tenants/:tenantId/modules" data-cwl-island="client"><div class="admin-page">
  <div class="page-header">
    <button class="back-button" data-cwl-nav="/admin/tenant-management" type="button">
      ← Back to Tenants
    </button>
    <h1>Module Configuration</h1>
    <div data-cwl-bind="if" data-cwl-hole-detail="tenantData"><p class="subtitle">
        <span data-cwl-bind="interp" data-cwl-hole-detail="tenantData.displayName || tenantData.name"></span> ()
      </p></div>
  </div>

  <div data-cwl-bind="if" data-cwl-hole-detail="tenantData"><div class="config-container">

      <!-- Subscription Tier -->
      <div class="section">
        <h2>📋 Subscription Tier</h2>
        <div class="tier-selector">
          <select data-cwl-on-change="action:applyTierDefaults">

              <option value=free>Free</option>

              <option value=basic>Basic</option>

              <option value=professional>Professional</option>

              <option value=enterprise>Enterprise</option>

              <option value=custom>Custom</option>

          </select>
          <button class="btn-secondary" data-cwl-action="applyTierDefaults" aria-label="Apply Tier Defaults">
            Apply Tier Defaults
          </button>
        </div>
      </div>

      <!-- Enabled Modules -->
      <div class="section">
        <h2>🎛️ Enabled Modules</h2>
        <div class="module-toggles">
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📊</span>
              <span>PCI Resolution & Network Optimization</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📡</span>
              <span>CBRS Management</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🔐</span>
              <span>HSS & Subscriber Management</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🗺️</span>
              <span>Coverage Map</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📦</span>
              <span>Inventory Management</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🌐</span>
              <span>Distributed EPC (Advanced)</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🔍</span>
              <span>Monitoring & Alerts</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📞</span>
              <span>Voice / SIP & UC</span>
            </span>
          </label>
        </div>
      </div>

      <!-- Usage Limits -->
      <div class="section">
        <h2>📊 Usage Limits</h2>
        <div class="limits-grid">
          <div class="limit-item">
            <label>Max Tower Sites</label>
            <input type="number" min="0" />
          </div>

          <div class="limit-item">
            <label>Max Subscribers</label>
            <input type="number" min="0" />
          </div>

          <div class="limit-item">
            <label>Max CPE Devices</label>
            <input type="number" min="0" />
          </div>

          <div class="limit-item">
            <label>Max Users</label>
            <input type="number" min="1" />
          </div>

          <div class="limit-item">
            <label>Max Inventory Items</label>
            <input type="number" min="0" />
          </div>
        </div>
        <p class="help-text">Set to 999999 for unlimited</p>
      </div>

      <!-- Feature Flags -->
      <div class="section">
        <h2>⭐ Feature Flags</h2>
        <div class="feature-toggles">
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Advanced Reporting</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>API Access</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>White Label</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Custom Integrations</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Priority Support</span>
            </span>
          </label>
        </div>
      </div>

      <!-- Save Button -->
      <div class="actions">
        <button class="btn-secondary" data-cwl-nav="/admin/tenant-management">
          Cancel
        </button>
        <button class="btn-primary" data-cwl-action="handleSave" data-cwl-attr-disabled="isSaving" aria-label="Save">
          💾 Save Configuration
        </button>
      </div>
    </div></div>
    <div class="loading" hidden aria-hidden="true">Loading...</div>

</div></div>
<script type="application/json" id="cwl-page-load">{"source":"origin-convert-all","httpPath":"/admin/tenants/:tenantId/modules"}</script>
