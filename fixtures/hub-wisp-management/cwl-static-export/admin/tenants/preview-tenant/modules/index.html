<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modules</title>
<link rel="stylesheet" href="/assets/original-css/admin_tenants_tenantId_modules.css"><link rel="stylesheet" href="/assets/original-css/_layout.css">
</head>
<body>
<div class="admin-page">
  <div class="page-header">
    <button class="back-button">
      ← Back to Tenants
    </button>
    <h1>Module Configuration</h1>
    
  </div>
  
  
  
  
  
  
    <div class="config-container">
      
      <!-- Subscription Tier -->
      <div class="section">
        <h2>📋 Subscription Tier</h2>
        <div class="tier-selector">
          <select>
            <div data-cwl-hole="legacy:markup-lift-svelte-each" data-cwl-hole-detail="tiers as tier"><option></option></div>
          </select>
          <button class="btn-secondary">
            Apply Tier Defaults
          </button>
        </div>
      </div>
      
      <!-- Enabled Modules -->
      <div class="section">
        <h2>🎛️ Enabled Modules</h2>
        <div class="module-toggles">
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📊</span>
              <span>PCI Resolution & Network Optimization</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📡</span>
              <span>CBRS Management</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📡</span>
              <span>ACS CPE Management</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🔐</span>
              <span>HSS & Subscriber Management</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🗺️</span>
              <span>Coverage Map</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📦</span>
              <span>Inventory Management</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🌐</span>
              <span>Distributed EPC (Advanced)</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">🔍</span>
              <span>Monitoring & Alerts</span>
            </span>
          </label>

          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span class="toggle-icon">📞</span>
              <span>Voice / SIP & UC</span>
            </span>
          </label>
        </div>
      </div>
      
      <!-- Usage Limits -->
      <div class="section">
        <h2>📊 Usage Limits</h2>
        <div class="limits-grid">
          <div class="limit-item">
            <label>Max Tower Sites</label>
            <input type="number" min="0" />
          </div>
          
          <div class="limit-item">
            <label>Max Subscribers</label>
            <input type="number" min="0" />
          </div>
          
          <div class="limit-item">
            <label>Max CPE Devices</label>
            <input type="number" min="0" />
          </div>
          
          <div class="limit-item">
            <label>Max Users</label>
            <input type="number" min="1" />
          </div>
          
          <div class="limit-item">
            <label>Max Inventory Items</label>
            <input type="number" min="0" />
          </div>
        </div>
        <p class="help-text">Set to 999999 for unlimited</p>
      </div>
      
      <!-- Feature Flags -->
      <div class="section">
        <h2>⭐ Feature Flags</h2>
        <div class="feature-toggles">
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Advanced Reporting</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>API Access</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>White Label</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Custom Integrations</span>
            </span>
          </label>
          
          <label class="toggle-item">
            <input type="checkbox" />
            <span class="toggle-label">
              <span>Priority Support</span>
            </span>
          </label>
        </div>
      </div>
      
      <!-- Save Button -->
      <div class="actions">
        <button class="btn-secondary">
          Cancel
        </button>
        <button class="btn-primary">
          💾 Save Configuration
        </button>
      </div>
    </div>
  
</div>

</body>
</html>
