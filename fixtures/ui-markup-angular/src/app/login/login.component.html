<main class="login-page">
  <div class="login-card">
    <h1>{{ title }}</h1>
    <p *ngIf="showHint" class="hint">Enter credentials</p>
    <ul>
      <li *ngFor="let item of items">{{ item.label }}</li>
    </ul>
    <p>{{ status$ | async }}</p>
    <app-status-badge></app-status-badge>
    <app-upgrade-modal [isOpen]="showUpgradeModal">
      <ng-content></ng-content>
    </app-upgrade-modal>
    <button type="button" [disabled]="busy" (click)="onSubmit()">Sign in</button>
  </div>
</main>
