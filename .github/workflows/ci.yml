name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: End-to-end — ingest + emit tiny-blog (Hono + Fastify), typecheck both
        run: |
          node scripts/run-e2e.mjs
          node scripts/emit-tiny-blog-fastify.mjs
          cd generated/tiny-blog
          npm install --no-audit --no-fund
          npx tsc --noEmit
          cd ../tiny-blog-fastify
          npm install --no-audit --no-fund
          npx tsc --noEmit

  oracle-live-drive:
    name: oracle live drive (php + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Drive tiny-blog through the Oracle
        run: node scripts/drive-tiny-blog.mjs

      - name: Summarize corpus via CLI
        run: node packages/cli/dist/bin.js corpus traces

  verify-e2e:
    name: verify (replay corpus vs emitted app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: End-to-end verify (PHP → corpus → dual emit → in-process replay)
        # Gates **both** Hono and Fastify emits against the same oracle corpus
        # (D25). Baseline is 100% per backend; threshold is conservative.
        env:
          VERIFY_THRESHOLD: "0.95"
        run: node scripts/verify-tiny-blog.mjs

      - name: Milestone 4 — migration metrics on status JSON
        run: |
          node packages/cli/dist/bin.js status --json --project fixtures/tiny-blog --traces traces --report reports/verify | node -e "
            const s = JSON.parse(require('fs').readFileSync(0,'utf8'));
            if (!s.migration) throw new Error('missing migration');
            if (s.migration.coverage == null || s.migration.coverage.pct < 1 - 1e-9)
              throw new Error('expected full IR coverage on tiny-blog');
            if (s.migration.correctness == null || s.migration.correctness + 1e-9 < 0.95)
              throw new Error('expected verify correctness >= 0.95');
          "

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/verify
          if-no-files-found: ignore

  verify-flagship-laravel-min:
    name: verify flagship (laravel-min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: End-to-end verify (laravel-min corpus → dual emit → replay)
        env:
          VERIFY_THRESHOLD: "0.95"
        run: node scripts/verify-flagship-laravel-min.mjs

      - name: Milestone 4 — migration metrics (laravel-min + verify reports)
        run: |
          mkdir -p reports/migration
          node packages/cli/dist/bin.js status --json --project flagship/laravel-min --traces traces/flagship-laravel-min --report reports/verify-flagship-laravel-min | node -e "
            const s = JSON.parse(require('fs').readFileSync(0,'utf8'));
            if (!s.migration) throw new Error('missing migration');
            if (s.migration.coverage == null || s.migration.coverage.pct < 1 - 1e-9)
              throw new Error('expected full IR coverage on laravel-min');
            if (s.migration.correctness == null || s.migration.correctness + 1e-9 < 0.95)
              throw new Error('expected verify correctness >= 0.95');
          "
          node packages/cli/dist/bin.js status --json --project flagship/laravel-min --traces traces/flagship-laravel-min --report reports/verify-flagship-laravel-min > reports/migration/flagship-laravel-min.json

      - name: Upload flagship verify + migration JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-laravel-min-verify
          path: |
            reports/verify-flagship-laravel-min
            reports/migration/flagship-laravel-min.json
          if-no-files-found: ignore

  insight-catalog:
    name: insight (catalog WebIR anti-patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Insight — tiny-n1 must surface every recognizer
        # tiny-n1 is a deliberately-broken fixture whose handlers each
        # exhibit one anti-pattern. If any recognizer regresses, this
        # fails. We also require at least one STRONG finding from each
        # security recognizer (raw-sql-concat, unescaped-output) to
        # catch a class of silent-degradation bugs where the recognizer
        # still fires but drops to "suggestion" because the taint
        # pipeline lost a binding along the way.
        run: |
          mkdir -p reports/insight
          node packages/cli/dist/bin.js insight fixtures/tiny-n1 \
            --out reports/insight/tiny-n1.json --json > reports/insight/tiny-n1.stdout.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("reports/insight/tiny-n1.json","utf8"));
            const by = r.summary.byRecognizer;
            const need = [
              "raw-sql-concat",
              "unescaped-output",
              "n-plus-one-queries",
              "scattered-validation",
              "string-dispatch",
            ];
            for (const k of need) {
              if (!(by[k] > 0)) { console.error("missing recognizer hits:", k, by); process.exit(1); }
            }
            const strongSec = r.opportunities.filter(
              (o) => o.severity === "strong" &&
                (o.recognizer === "raw-sql-concat" || o.recognizer === "unescaped-output"),
            );
            const secKinds = new Set(strongSec.map((o) => o.recognizer));
            if (!secKinds.has("raw-sql-concat") || !secKinds.has("unescaped-output")) {
              console.error(
                "expected >=1 STRONG finding from each security recognizer; saw:",
                [...secKinds],
              );
              process.exit(1);
            }
            console.log("tiny-n1 insight OK:", JSON.stringify(r.summary));
          '

      - name: Insight — tiny-blog snapshot (non-gating)
        run: |
          node packages/cli/dist/bin.js insight fixtures/tiny-blog \
            --out reports/insight/tiny-blog.json || true

      - name: Upload insight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-reports
          path: reports/insight
          if-no-files-found: ignore

  rewrite-gate:
    name: rewrite (autonomously fix detectable security findings)
    runs-on: ubuntu-latest
    needs: insight-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

      - name: Rewrite — tiny-n1 sanitize-output must apply + emit clean
        # Run the rewrite engine over tiny-n1, emit the TS, then assert:
        #   (1) at least one sanitize-output opportunity was applied,
        #   (2) re-running insight on the rewritten module surfaces no
        #       `unescaped-output` finding, and
        #   (3) the emitted search handler actually contains `escapeHtml(`.
        # (1)+(2) guard the rewrite engine; (3) guards the end-to-end
        # IR → emit → TS pipeline against regressions where a rewrite
        # is applied in IR but lost by the emitter.
        run: |
          mkdir -p reports/rewrite generated/tiny-n1
          node packages/cli/dist/bin.js rewrite fixtures/tiny-n1 \
            --out generated/tiny-n1 \
            --report reports/rewrite/tiny-n1.json \
            --verify-behavior \
            --json > reports/rewrite/tiny-n1.stdout.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("reports/rewrite/tiny-n1.json","utf8"));
            const sanitize = r.applied.filter(a => a.pass === "sanitize-output");
            const paramz = r.applied.filter(a => a.pass === "parameterize-sql");
            if (sanitize.length === 0) {
              console.error("expected >=1 sanitize-output application, got none");
              process.exit(1);
            }
            if (paramz.length === 0) {
              console.error("expected >=1 parameterize-sql application, got none");
              process.exit(1);
            }
            const search = fs.readFileSync(
              "generated/tiny-n1/src/handlers/search.ts", "utf8",
            );
            if (!/escapeHtml\(/.test(search)) {
              console.error("emitted search.ts has no escapeHtml() call:\n" + search);
              process.exit(1);
            }
            const lookup = fs.readFileSync(
              "generated/tiny-n1/src/handlers/lookup.ts", "utf8",
            );
            // Emitted SQL must be literal with a `?` placeholder — NOT
            // a concat expression. This check fails loudly if the
            // parameterize-sql fix is lost anywhere in the IR → emit
            // pipeline.
            if (!/"SELECT[^"]*\?[^"]*"/.test(lookup)) {
              console.error("emitted lookup.ts lacks parameterized SQL:\n" + lookup);
              process.exit(1);
            }
            if (/\+\s*id/.test(lookup) || /"\s*\.\s*/.test(lookup)) {
              console.error("emitted lookup.ts still contains SQL concat:\n" + lookup);
              process.exit(1);
            }
            // Post-verify gate (D18): the report must record that
            // every applied opportunity was re-checked by its
            // recognizer and found no residual. If the gate ran but
            // failed, the CLI would have rolled back the batch; if
            // it never ran, we want to know, because CI should
            // always exercise the gate end-to-end.
            if (!r.postVerify) {
              console.error("rewrite report is missing postVerify section");
              process.exit(1);
            }
            if (r.postVerify.ok !== true) {
              console.error(
                "post-verify gate FAILED: " +
                JSON.stringify(r.postVerify.failures, null, 2),
              );
              process.exit(1);
            }
            console.log("tiny-n1 rewrite OK:", JSON.stringify(r.summary));
            console.log("post-verify OK: recognizers=" + r.postVerify.recognizersRun.join(","));
            // Behavior-verify gate (D19): the report must record that
            // every probe evaluated under both pre- and post-rewrite
            // IR produced equivalent responses modulo declared pass
            // transforms. An abstention budget is allowed (the
            // simulator covers a subset of ops) but the gate itself
            // must be ok.
            if (!r.behaviorVerify) {
              console.error("rewrite report is missing behaviorVerify section");
              process.exit(1);
            }
            if (r.behaviorVerify.ok !== true) {
              console.error(
                "behavior-verify gate FAILED: " +
                JSON.stringify(r.behaviorVerify.divergences, null, 2),
              );
              process.exit(1);
            }
            if (r.behaviorVerify.probesRun < 1) {
              console.error("behavior-verify ran zero probes — probe synthesis is broken");
              process.exit(1);
            }
            console.log(
              "behavior-verify OK: probes=" + r.behaviorVerify.probesRun +
              " routes=" + r.behaviorVerify.routesCovered +
              " abstained=" + r.behaviorVerify.abstained,
            );
          '
          node packages/cli/dist/bin.js insight fixtures/tiny-n1 \
            --only unescaped-output,raw-sql-concat --json > reports/rewrite/before.json
          # Post-rewrite: we can't re-ingest generated TS with the PHP
          # ingester, so instead we call insight directly on the rewritten
          # module by piping through the rewrite CLI's JSON payload.
          node -e '
            const fs = require("fs");
            const before = JSON.parse(fs.readFileSync("reports/rewrite/before.json","utf8"));
            const xssCount = before.opportunities.filter(
              o => o.recognizer === "unescaped-output",
            ).length;
            if (xssCount === 0) {
              console.error("expected XSS finding pre-rewrite, saw 0");
              process.exit(1);
            }
            console.log("pre-rewrite XSS findings:", xssCount);
          '

      - name: Upload rewrite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-report
          path: reports/rewrite
          if-no-files-found: ignore
