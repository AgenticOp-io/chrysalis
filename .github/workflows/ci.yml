name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck-and-test:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: chrysalis_mysqli_ci
          MYSQL_DATABASE: chrysalis_mysqli_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchrysalis_mysqli_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # Match shivammathur/setup-php service examples (laravel-mysql.yml): stable Docker health parsing.
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up PHP (parser-bridge nikic provider)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: mysqli, redis

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Root TypeScript solution build
        run: pnpm exec tsc -b --force

      - name: Build
        run: pnpm -r build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Python + Go CLI shims (forward to Node CLI, DESIGN D295)
        run: pnpm run test:cli-shims

      - name: Oracle-php Redactor smoke (sql.row + sql.params)
        run: |
          php packages/oracle-php/tests/redactor_sql_rows_test.php
          php packages/oracle-php/tests/redactor_sql_params_test.php

      - name: Oracle-php Redis session bridge smoke (D273)
        env:
          CHRYSALIS_SESSION_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          php -r 'if (!extension_loaded("redis")) { fwrite(STDERR, "error: phpredis (redis) extension not loaded\n"); exit(1);}'
          pnpm run test:oracle-php-session-redis

      - name: Oracle-php mysqli capture smoke (MySQL 8 service)
        env:
          CHRYSALIS_MYSQLI_SMOKE: "1"
          CHRYSALIS_MYSQL_HOST: 127.0.0.1
          CHRYSALIS_MYSQL_PORT: "3306"
          CHRYSALIS_MYSQL_USER: root
          CHRYSALIS_MYSQL_PASSWORD: chrysalis_mysqli_ci
          CHRYSALIS_MYSQL_DATABASE: chrysalis_mysqli_smoke
        run: php packages/oracle-php/tests/mysqli_capture_smoke.php

      - name: Parser-bridge nikic parity (Vitest)
        run: |
          pnpm run vendor:parser-bridge
          pnpm exec vitest run packages/parser-bridge/tests/nikic.test.ts

      - name: Test
        run: pnpm test

      - name: WISP CWL Phase 12 Phase 0 close (G6310)
        run: pnpm run hub:wisp-cwl-phase12-phase0-close-smoke

      - name: WISP CWL Phase 12 pipeline (fixtures; G6320)
        run: pnpm run hub:wisp-cwl-pipeline-smoke

      - name: WISP CWL dual deploy config (G6330)
        run: pnpm run hub:wisp-cwl-dual-deploy-config-smoke

      - name: CWL surface taxonomy (G6340)
        run: pnpm run hub:cwl-surface-taxonomy-smoke

      - name: WISP CWL Phase 13 M0 surfaces (G6350)
        run: pnpm run hub:wisp-cwl-phase13-m0-smoke

      - name: WISP CWL Phase 13 M1 surfaces (G6360)
        run: pnpm run hub:wisp-cwl-phase13-m1-smoke
      - name: WISP CWL Phase 13 M2 surfaces (G6370)
        run: pnpm run hub:wisp-cwl-phase13-m2-smoke
      - name: WISP CWL Phase 13 M3 surfaces (G6380)
        run: pnpm run hub:wisp-cwl-phase13-m3-smoke
      - name: WISP CWL Phase 13 M4 surfaces (G6390)
        run: pnpm run hub:wisp-cwl-phase13-m4-smoke
      - name: WISP CWL Phase 13 M5 cutover (G6400)
        run: pnpm run hub:wisp-cwl-phase13-m5-smoke

      - name: WISP CWL Phase 13 M6 effects (G6420)
        run: pnpm run hub:wisp-cwl-phase13-m6-smoke

      - name: WISP CWL Phase 13 close (G6410)
        run: pnpm run hub:wisp-cwl-phase13-close-smoke

      - name: WISP CWL Phase 14 HSS proxy (G6530)
        run: pnpm run hub:wisp-cwl-phase14-hss-proxy-smoke

      - name: WISP CWL Phase 14 demo manifest (G6540)
        run: pnpm run hub:wisp-cwl-phase14-demo-manifest-smoke

      - name: WISP CWL Phase 14 remote demo (G6600)
        run: pnpm run hub:wisp-cwl-phase14-remote-demo-smoke

      - name: WISP CWL Phase 14 pipeline remote verify (G6650)
        run: pnpm run hub:wisp-cwl-phase14-pipeline-remote-verify-smoke

      - name: WISP CWL Phase 14 operator verify (G6680)
        run: pnpm run hub:wisp-cwl-phase14-operator-verify-smoke

      - name: WISP CWL Phase 14 live backend (G6700)
        run: pnpm run hub:wisp-cwl-phase14-live-backend-smoke

      - name: WISP CWL Phase 14 client redirect (G6510)
        run: pnpm run hub:wisp-cwl-phase14-client-redirect-smoke

      - name: WISP CWL Phase 14 operator close (G6520)
        run: pnpm run hub:wisp-cwl-phase14-operator-close-smoke

      - name: WISP CWL Phase 14 close (G6590)
        run: pnpm run hub:wisp-cwl-phase14-close-smoke

      - name: WISP CWL pipeline artifact gate
        run: pnpm run ci:wisp-cwl-pipeline

      - name: Checkout wptp-matrix (hub contract-first oracle)
        uses: actions/checkout@v4
        with:
          repository: theorem6/wptp-matrix
          ref: v0.1.10
          path: wptp-matrix

      - name: Install wptp-matrix dependencies
        run: npm ci --prefix wptp-matrix && npm run build --prefix wptp-matrix

      - name: Checkout wptp-emit-nextjs (hub Next.js structural gold)
        uses: actions/checkout@v4
        with:
          repository: theorem6/wptp-emit-nextjs
          ref: main
          path: wptp-emit-nextjs

      - name: Install wptp-emit-nextjs
        run: npm ci --prefix wptp-emit-nextjs && npm run build --prefix wptp-emit-nextjs

      - name: Hub WPTP matrix gold smoke
        env:
          WPTP_MATRIX_ROOT: ${{ github.workspace }}/wptp-matrix
        run: pnpm run hub:wptp-gold-smoke

      - name: Hub matrix completion (smoke + gold + trace replay)
        env:
          WPTP_EMIT_NEXTJS_ROOT: ${{ github.workspace }}/wptp-emit-nextjs
          WPTP_MATRIX_ROOT: ${{ github.workspace }}/wptp-matrix
          CHRYSALIS_HUB_COMPLETION_REQUIRE_WPTP_NEXTJS: "1"
          CHRYSALIS_HUB_COMPLETION_REQUIRE_WPTP_STRICT_BATCH: "1"
          CHRYSALIS_HUB_COMPLETION_REQUIRE_GAPS_INGEST_CLOSURE_BATCH: "1"
          CHRYSALIS_HUB_GAP_REINGEST_STRICT: "1"
          CHRYSALIS_HUB_GAP_REINGEST_VERIFY_CLOSURE: "1"
          CHRYSALIS_HUB_GAP_REINGEST_VERIFY_REPLAY: "1"
          CHRYSALIS_HUB_GAP_REINGEST_VERIFY_HTTP: "1"
        run: pnpm run ci:hub-completion

      - name: Gate verify merged-summary JSON (fixture contract)
        run: node scripts/ci-gates.mjs verify-merged-summary fixtures/ci/verify-merged-summary-smoke.json

      - name: Gate corpus-merge summary JSON (fixture contract)
        run: node scripts/ci-gates.mjs corpus-merge-summary fixtures/ci/corpus-merge-summary-smoke.json

      - name: Migration debt JSON (tiny-blog) + ingest hole gate
        # `--max-holes` uses ingest-only residualLegacy (no verify reports needed).
        run: node scripts/migration-debt.mjs --project fixtures/tiny-blog --json-out reports/ci/migration-debt.json --max-holes 0

      - name: Migration debt — mysqli-probe hole ceiling
        # Ceiling tracks known residual ingest holes (see `chrysalis status --json`); raise only when debt grows.
        run: node scripts/migration-debt.mjs --project fixtures/mysqli-probe --max-holes 0

      - name: Migration debt — db-query-unknown-receiver-probe hole ceiling
        # Negative probe: one expected `legacy:db-query-unknown-receiver` hole (SQLite3).
        run: node scripts/migration-debt.mjs --project fixtures/db-query-unknown-receiver-probe --max-holes 1

      - name: Migration debt — laravel-shaped-db-factory-probe (zero holes)
        # Documents FQN `dbFactoryReturnCallees` (Illuminate DB facade shape, App\\Conn, Repo::db).
        run: node scripts/migration-debt.mjs --project fixtures/laravel-shaped-db-factory-probe --max-holes 0

      - name: Migration debt — parser-parity-probe (zero holes)
        run: node scripts/migration-debt.mjs --project fixtures/parser-parity-probe --max-holes 0

      - uses: actions/upload-artifact@v4
        with:
          name: migration-debt-json
          path: reports/ci/migration-debt.json
          if-no-files-found: warn

      - name: End-to-end — ingest + emit tiny-blog (Hono + Fastify), typecheck both
        run: |
          node scripts/run-e2e.mjs
          node scripts/emit-tiny-blog-fastify.mjs
          cd generated/tiny-blog
          npm install --no-audit --no-fund
          npx tsc --noEmit
          cd ../tiny-blog-fastify
          npm install --no-audit --no-fund
          npx tsc --noEmit

  oracle-live-drive:
    name: oracle live drive (php + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Oracle-php Redactor smoke (sql.row + sql.params)
        run: |
          php packages/oracle-php/tests/redactor_sql_rows_test.php
          php packages/oracle-php/tests/redactor_sql_params_test.php

      - name: Drive tiny-blog through the Oracle
        run: node scripts/drive-tiny-blog.mjs

      - name: Summarize corpus via CLI
        run: node packages/cli/dist/bin.js corpus traces

  verify-e2e:
    name: verify (replay corpus vs emitted app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          rm -rf packages/verify/dist
          pnpm -r build

      - name: Oracle-php Redactor smoke (sql.row + sql.params)
        run: |
          php packages/oracle-php/tests/redactor_sql_rows_test.php
          php packages/oracle-php/tests/redactor_sql_params_test.php

      - name: End-to-end verify (PHP → corpus → dual emit → in-process replay)
        # Gates **both** Hono and Fastify emits against the same oracle corpus
        # (D25). Baseline is 100% per backend; threshold is conservative.
        env:
          VERIFY_THRESHOLD: "0.95"
        run: node scripts/verify-tiny-blog.mjs

      - name: Gate verify dual-summary JSON (tiny-blog)
        run: node scripts/ci-gates.mjs verify-dual-summary reports/ci/verify-e2e-summary.json

      - name: Gate verify merged-summary JSON (tiny-blog partition smoke)
        env:
          CHRYSALIS_VERIFY_MERGED_MIN_CORRECTNESS: "0.95"
        run: node scripts/ci-gates.mjs verify-merged-summary reports/ci/verify-e2e-merged-summary.json

      - name: Migration debt gates (tiny-blog, post-verify)
        # `--min-correctness` requires `reports/verify` (dual-backend summaries).
        run: node scripts/migration-debt.mjs --project fixtures/tiny-blog --traces traces --report reports/verify --max-holes 0 --min-correctness 1

      - name: Milestone 4 — migration metrics on status JSON
        run: |
          node packages/cli/dist/bin.js status --json --project fixtures/tiny-blog --traces traces --report reports/verify | node scripts/ci-gates.mjs status-migration

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            reports/verify
            reports/ci/verify-e2e-summary.json
            reports/ci/verify-e2e-merged-summary.json
          if-no-files-found: ignore

  verify-flagship-laravel-min:
    name: verify flagship (laravel-min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          tools: composer:v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          rm -rf packages/verify/dist
          pnpm -r build

      - name: Oracle-php Redactor smoke (sql.row + sql.params)
        run: |
          php packages/oracle-php/tests/redactor_sql_rows_test.php
          php packages/oracle-php/tests/redactor_sql_params_test.php

      - name: Composer install (laravel-min autoload)
        run: composer install --no-interaction --no-progress --no-dev
        working-directory: flagship/laravel-min

      - name: End-to-end verify (laravel-min corpus → dual emit → replay)
        env:
          VERIFY_THRESHOLD: "0.95"
        run: node scripts/verify-flagship-laravel-min.mjs

      - name: Gate verify dual-summary JSON (laravel-min)
        env:
          CHRYSALIS_VERIFY_DUAL_PROFILE: "flagship-laravel-min"
        run: node scripts/ci-gates.mjs verify-dual-summary reports/ci/verify-flagship-laravel-min-summary.json

      - name: Milestone 4 — migration metrics (laravel-min + verify reports)
        env:
          VERIFY_THRESHOLD: "0.95"
        run: pnpm run status:laravel-min

      - name: Gate migration sidecar floors (idiomaticity / residual-legacy)
        run: pnpm run release-gate:migration-sidecars

      - name: Upload flagship verify + migration JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-laravel-min-verify
          path: |
            reports/verify-flagship-laravel-min
            reports/ci/verify-flagship-laravel-min-summary.json
            reports/migration/flagship-laravel-min.json
            reports/migration/flagship-laravel-min-emit-stats.json
            reports/migration/idiomaticity.json
            reports/migration/residual-legacy.json
          if-no-files-found: ignore

  verify-flagship-laravel-full:
    name: verify flagship (laravel-full scaffold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          tools: composer:v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-cache-${{ runner.os }}-${{ hashFiles('scripts/scaffold-flagship-laravel.mjs') }}

      - name: Restore scaffolded Laravel worktree cache
        uses: actions/cache@v4
        with:
          path: flagship/chrysalis-laravel-work
          key: laravel-full-work-breeze-${{ runner.os }}-${{ hashFiles('scripts/scaffold-flagship-laravel.mjs', 'flagship/laravel-full/chrysalis-templates/**') }}

      - name: Restore confidence trend history
        id: confidence-history-restore
        uses: actions/cache/restore@v4
        with:
          path: reports/confidence/history
          key: confidence-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            confidence-history-${{ runner.os }}-${{ github.ref_name }}-
            confidence-history-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          rm -rf packages/verify/dist
          pnpm -r build

      - name: Oracle-php Redactor smoke (sql.row + sql.params)
        run: |
          php packages/oracle-php/tests/redactor_sql_rows_test.php
          php packages/oracle-php/tests/redactor_sql_params_test.php

      - name: Decide confidence trend mode (warmup vs strict)
        env:
          CONFIDENCE_STREAK_REQUIRED: "30"
        run: |
          if node scripts/ci-gates.mjs confidence-trend-ready reports/confidence/history/flagship-laravel-full.history.json; then
            echo "CONFIDENCE_TREND_ALLOW_WARMUP=0" >> "$GITHUB_ENV"
            echo "confidence trend mode: strict"
          else
            echo "CONFIDENCE_TREND_ALLOW_WARMUP=1" >> "$GITHUB_ENV"
            echo "confidence trend mode: warmup"
          fi

      - name: Scaffold/refresh Composer Laravel worktree
        env:
          # Milestone 5: prove Breeze + Chrysalis template routes coexist (ingest stays manifest-scoped).
          CHRYSALIS_SCAFFOLD_BREEZE: "1"
        run: pnpm run scaffold:laravel-full

      - name: Verify composer-backed flagship slice
        env:
          VERIFY_THRESHOLD: "1"
          CONFIDENCE_5NINES: "0.99999"
          CONFIDENCE_STREAK_REQUIRED: "30"
        run: pnpm run verify:laravel-full:5nines

      - name: Gate verify dual-summary JSON (laravel-full)
        env:
          CHRYSALIS_VERIFY_DUAL_PROFILE: "flagship-laravel-full"
        run: node scripts/ci-gates.mjs verify-dual-summary reports/ci/verify-flagship-laravel-full-summary.json

      - name: Compute migration status (laravel-full)
        env:
          VERIFY_THRESHOLD: "0.95"
        run: pnpm run status:laravel-full

      - name: Gate migration sidecar floors (idiomaticity / residual-legacy)
        run: pnpm run release-gate:migration-sidecars

      - name: Upload flagship laravel-full verify + migration JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-laravel-full-verify
          path: |
            reports/verify-flagship-laravel-full
            reports/ci/verify-flagship-laravel-full-summary.json
            reports/migration/flagship-laravel-full.json
            reports/migration/flagship-laravel-full-emit-stats.json
            reports/migration/idiomaticity.json
            reports/migration/residual-legacy.json
            reports/confidence/flagship-laravel-full.json
            reports/confidence/history/flagship-laravel-full.history.json
          if-no-files-found: ignore

      - name: Save confidence trend history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/confidence/history
          key: confidence-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

  insight-catalog:
    name: insight (catalog WebIR anti-patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Insight — tiny-n1 must surface every recognizer
        # tiny-n1 is a deliberately-broken fixture whose handlers each
        # exhibit one anti-pattern. If any recognizer regresses, this
        # fails. We also require at least one STRONG finding from each
        # security recognizer (raw-sql-concat, unescaped-output) to
        # catch a class of silent-degradation bugs where the recognizer
        # still fires but drops to "suggestion" because the taint
        # pipeline lost a binding along the way.
        run: |
          mkdir -p reports/insight
          node packages/cli/dist/bin.js insight fixtures/tiny-n1 \
            --out reports/insight/tiny-n1.json --json > reports/insight/tiny-n1.stdout.json
          node scripts/ci-gates.mjs tiny-n1-insight

      - name: Insight — tiny-blog snapshot (non-gating)
        run: |
          node packages/cli/dist/bin.js insight fixtures/tiny-blog \
            --out reports/insight/tiny-blog.json || true

      - name: Upload insight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-reports
          path: reports/insight
          if-no-files-found: ignore

  rewrite-gate:
    name: rewrite (autonomously fix detectable security findings)
    runs-on: ubuntu-latest
    needs: insight-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

      - name: Set up PHP (tiny-n1 oracle capture)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Capture tiny-n1 corpus (rewrite trace gating)
        run: node scripts/drive-tiny-n1.mjs

      - name: Rewrite — tiny-n1 sanitize-output must apply + emit clean
        # Run the rewrite engine over tiny-n1, emit the TS, then assert:
        #   (1) at least one sanitize-output opportunity was applied,
        #   (2) re-running insight on the rewritten module surfaces no
        #       `unescaped-output` finding, and
        #   (3) the emitted search handler calls escapeHtml (AST check).
        # (1)+(2) guard the rewrite engine; (3) guards the end-to-end
        # IR → emit → TS pipeline against regressions where a rewrite
        # is applied in IR but lost by the emitter.
        run: |
          mkdir -p reports/rewrite generated/tiny-n1
          node packages/cli/dist/bin.js rewrite fixtures/tiny-n1 \
            --traces traces/tiny-n1-ci \
            --out generated/tiny-n1 \
            --report reports/rewrite/tiny-n1.json \
            --verify-behavior \
            --json > reports/rewrite/tiny-n1.stdout.json
          node scripts/ci-gates.mjs tiny-n1-rewrite
          node packages/cli/dist/bin.js insight fixtures/tiny-n1 \
            --only unescaped-output,raw-sql-concat --json > reports/rewrite/before.json
          # Post-rewrite: we can't re-ingest generated TS with the PHP
          # ingester, so instead we call insight directly on the rewritten
          # module by piping through the rewrite CLI's JSON payload.
          node scripts/ci-gates.mjs rewrite-pre-xss

      - name: Upload rewrite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-report
          path: reports/rewrite
          if-no-files-found: ignore
