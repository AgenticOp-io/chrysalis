name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: End-to-end — ingest + emit tiny-blog, typecheck the result
        run: |
          node scripts/run-e2e.mjs
          cd generated/tiny-blog
          npm install --no-audit --no-fund
          npx tsc --noEmit

  oracle-live-drive:
    name: oracle live drive (php + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Drive tiny-blog through the Oracle
        run: node scripts/drive-tiny-blog.mjs

      - name: Summarize corpus via CLI
        run: node packages/cli/dist/bin.js corpus traces

  verify-e2e:
    name: verify (replay corpus vs emitted app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: End-to-end verify (PHP → corpus → emit → replay)
        # Milestone 1 gate. Current baseline on tiny-blog is 100% (6/6)
        # traces passing after the `empty()` ingest fix. The threshold is
        # set conservatively below that so a single-trace regression surfaces
        # as a CI failure rather than a report-artifact detail. Raise to
        # 1.0 (perfect) once we're confident the surface is stable.
        env:
          VERIFY_THRESHOLD: "0.95"
        run: node scripts/verify-tiny-blog.mjs

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/verify
          if-no-files-found: ignore

  insight-catalog:
    name: insight (catalog WebIR anti-patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Insight — tiny-n1 must surface every recognizer
        # tiny-n1 is a deliberately-broken fixture whose handlers each
        # exhibit one anti-pattern. If any recognizer regresses, this
        # fails. We also require at least one STRONG finding from each
        # security recognizer (raw-sql-concat, unescaped-output) to
        # catch a class of silent-degradation bugs where the recognizer
        # still fires but drops to "suggestion" because the taint
        # pipeline lost a binding along the way.
        run: |
          mkdir -p reports/insight
          node packages/cli/dist/bin.js insight fixtures/tiny-n1 \
            --out reports/insight/tiny-n1.json --json > reports/insight/tiny-n1.stdout.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("reports/insight/tiny-n1.json","utf8"));
            const by = r.summary.byRecognizer;
            const need = [
              "raw-sql-concat",
              "unescaped-output",
              "n-plus-one-queries",
              "scattered-validation",
              "string-dispatch",
            ];
            for (const k of need) {
              if (!(by[k] > 0)) { console.error("missing recognizer hits:", k, by); process.exit(1); }
            }
            const strongSec = r.opportunities.filter(
              (o) => o.severity === "strong" &&
                (o.recognizer === "raw-sql-concat" || o.recognizer === "unescaped-output"),
            );
            const secKinds = new Set(strongSec.map((o) => o.recognizer));
            if (!secKinds.has("raw-sql-concat") || !secKinds.has("unescaped-output")) {
              console.error(
                "expected >=1 STRONG finding from each security recognizer; saw:",
                [...secKinds],
              );
              process.exit(1);
            }
            console.log("tiny-n1 insight OK:", JSON.stringify(r.summary));
          '

      - name: Insight — tiny-blog snapshot (non-gating)
        run: |
          node packages/cli/dist/bin.js insight fixtures/tiny-blog \
            --out reports/insight/tiny-blog.json || true

      - name: Upload insight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-reports
          path: reports/insight
          if-no-files-found: ignore
