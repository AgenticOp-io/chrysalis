name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: End-to-end — ingest + emit tiny-blog, typecheck the result
        run: |
          node scripts/run-e2e.mjs
          cd generated/tiny-blog
          npm install --no-audit --no-fund
          npx tsc --noEmit

  oracle-live-drive:
    name: oracle live drive (php + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Drive tiny-blog through the Oracle
        run: node scripts/drive-tiny-blog.mjs

      - name: Summarize corpus via CLI
        run: node packages/cli/dist/bin.js corpus traces

  verify-e2e:
    name: verify (replay corpus vs emitted app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: End-to-end verify (PHP → corpus → emit → replay)
        # Run the full loop and publish the correctness score. During
        # Milestone 1 we measure rather than gate: the loop working is what
        # matters, the number is what we improve. Flip `VERIFY_THRESHOLD`
        # to a real value once baseline correctness stabilizes.
        env:
          VERIFY_THRESHOLD: "0.0"
        run: node scripts/verify-tiny-blog.mjs

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/verify
          if-no-files-found: ignore
