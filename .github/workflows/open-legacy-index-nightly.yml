name: Open Legacy Index nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
  CHRYSALIS_POC_SKIP_BUILD: "1"

jobs:
  verify-matrix:
    name: Open Legacy verify matrix (G8510)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Open Legacy nightly verify matrix (G8510)
        run: pnpm run hub:site-port-open-legacy-nightly-smoke

      - name: Open Legacy index close (G8500)
        run: pnpm run hub:site-port-open-legacy-index-close-smoke

      - name: Open Legacy WordPress wedge (G8570)
        run: pnpm run hub:site-port-open-legacy-wedge-smoke

      - name: VMF hub API (G8530)
        run: pnpm run hub:site-port-federation-hub-api-smoke

      - name: VMF hub close (G8540)
        run: pnpm run hub:site-port-federation-hub-close-smoke
        env:
          CHRYSALIS_FEDERATION_CONTRIBUTOR: "ci-nightly-hub-close"

      - name: Intelligence Shorthand close (G8560, CPU only)
        run: pnpm run hub:intelligence-shorthand-close-smoke

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-legacy-index-nightly
          path: reports/open-legacy-index/nightly/
          if-no-files-found: ignore
