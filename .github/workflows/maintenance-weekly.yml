name: Maintenance weekly

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cwl-language-maintenance:
    name: G6731 IR helper maintenance composite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: CWL language maintenance (G6731)
        run: pnpm run hub:cwl-language-maintenance-smoke
