# Optional WPTP matrix harness with Chrysalis gold + silver paths (CHRYSALIS_ROOT).
name: wptp-harness-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/emit-webir-bundle-hono.mjs"
      - "scripts/emit-webir-bundle-nextjs.mjs"
      - "scripts/export-webir-bundle.mjs"
      - "fixtures/tiny-blog/**"
      - ".github/workflows/wptp-harness-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/emit-webir-bundle-hono.mjs"
      - "scripts/emit-webir-bundle-nextjs.mjs"
      - "scripts/export-webir-bundle.mjs"
      - "fixtures/tiny-blog/**"
      - ".github/workflows/wptp-harness-smoke.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  matrix-verify:
    name: wptp-matrix verify:harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Chrysalis
        run: |
          node scripts/ci-link-cwl-sibling.mjs --stage=sibling
          pnpm install --frozen-lockfile
          node scripts/ci-link-cwl-sibling.mjs --stage=links
          pnpm -r build

      - uses: actions/checkout@v4
        with:
          repository: AgenticOp-io/wptp-ir
          ref: v0.1.3
          path: wptp-ir

      - uses: actions/checkout@v4
        with:
          repository: AgenticOp-io/wptp-matrix
          ref: main
          path: wptp-matrix

      - uses: actions/checkout@v4
        with:
          repository: AgenticOp-io/wptp-emit-nextjs
          ref: main
          path: wptp-emit-nextjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # matrix package-lock on main is out of sync with @wptp/ir (npm ci EUSAGE).
      # Install sibling @wptp/ir from checkout (same pattern as webir-bundle-to-wptp-ir).
      - name: Install wptp-ir
        working-directory: wptp-ir
        run: npm install && npm run build

      - name: Install wptp-matrix from sibling wptp-ir
        working-directory: wptp-matrix
        run: |
          # package-lock on main omits @wptp/ir@0.1.3 → npm ci EUSAGE. Prefer sibling checkout.
          npm pkg set "dependencies.@wptp/ir=file:../wptp-ir"
          npm install --no-package-lock
          npm run build
          test -d node_modules/@wptp/ir
          node -e "import('@wptp/ir').then((m) => { if (typeof m.importWebIrBundleJson !== 'function') process.exit(1); console.log('ok @wptp/ir'); })"

      - name: Install wptp-emit-nextjs
        working-directory: wptp-emit-nextjs
        run: npm ci && npm run build

      - name: Verify tiny-blog (populate reports/verify for harness gold)
        run: node scripts/verify-tiny-blog.mjs

      - name: verify:harness (php-webir-hono gold + silver Chrysalis compose)
        working-directory: wptp-matrix
        env:
          CHRYSALIS_ROOT: ${{ github.workspace }}
          WPTP_IR_ROOT: ${{ github.workspace }}/wptp-ir
          WPTP_EMIT_NEXTJS_ROOT: ${{ github.workspace }}/wptp-emit-nextjs
          WPTP_PHP_WEBIR_MIN_CORRECTNESS_PCT: "60"
        run: npm run verify:harness
