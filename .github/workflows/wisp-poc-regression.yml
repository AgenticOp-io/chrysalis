name: WISP POC regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wisp-poc:
    name: WISP showcase extended operator regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: WISP CWL Phase 12 Phase 0 close (G6310)
        run: pnpm run hub:wisp-cwl-phase12-phase0-close-smoke

      - name: WISP CWL Phase 12 pipeline (fixtures; G6320)
        run: pnpm run hub:wisp-cwl-pipeline-smoke

      - name: WISP CWL dual deploy config (G6330)
        run: pnpm run hub:wisp-cwl-dual-deploy-config-smoke

      - name: WISP full site program close (G7790; post Phase 27 fixture)
        run: pnpm run hub:wisp-full-site-close-smoke
        env:
          CHRYSALIS_STRATEGIC_PLAN_SKIP_FLAGSHIP_GOLD: "1"

      - name: WISP CWL Phase 13 close doc gate (G6410 archived slice)
        run: pnpm run hub:wisp-cwl-phase13-close-smoke

      - name: WISP CWL Phase 14 operator smokes (G6510–G6700)
        run: |
          pnpm run hub:wisp-cwl-phase14-hss-proxy-smoke
          pnpm run hub:wisp-cwl-phase14-demo-manifest-smoke
          pnpm run hub:wisp-cwl-phase14-remote-demo-smoke
          pnpm run hub:wisp-cwl-phase14-pipeline-remote-verify-smoke
          pnpm run hub:wisp-cwl-phase14-operator-verify-smoke
          pnpm run hub:wisp-cwl-phase14-live-backend-smoke
          pnpm run hub:wisp-cwl-phase14-client-redirect-smoke
          pnpm run hub:wisp-cwl-phase14-operator-close-smoke
          pnpm run hub:wisp-cwl-phase14-close-smoke
          pnpm run hub:wisp-cwl-phase14-program-close-smoke

      - name: WISP CWL maintenance regression (G6710–G6720)
        run: |
          pnpm run hub:wisp-cwl-maintenance-regression-smoke
          pnpm run hub:wisp-cwl-program-maintenance-complete-smoke

      - name: Open web-LLM framework close (G8290)
        run: pnpm run hub:open-web-llm-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: Open web-LLM agent POC (G8300)
        run: pnpm run hub:open-web-llm-poc-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: Site port to CWL close (G8400)
        run: pnpm run hub:site-port-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: Site port verify matrix (G8410)
        run: pnpm run hub:site-port-verify-matrix-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: Open Legacy Index multi-origin close (G8490)
        run: pnpm run hub:site-port-open-legacy-index-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: Site port federation close (G8460)
        run: pnpm run hub:site-port-federation-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_FEDERATION_CONTRIBUTOR: "ci-smoke"

      - name: Site port federation POC close (G8470)
        run: pnpm run hub:site-port-federation-poc-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"
          CHRYSALIS_FEDERATION_CONTRIBUTOR: "ci-poc-smoke"

      - name: Migration evidence POC close (G8480)
        run: pnpm run hub:migration-evidence-poc-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"
          CHRYSALIS_FEDERATION_CONTRIBUTOR: "ci-evidence-smoke"

      - name: VMF hub API (G8530)
        run: pnpm run hub:site-port-federation-hub-api-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"

      - name: VMF hub close (G8540)
        run: pnpm run hub:site-port-federation-hub-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"
          CHRYSALIS_FEDERATION_CONTRIBUTOR: "ci-hub-close-smoke"

      - name: Intelligence Shorthand close (G8560, CPU only)
        run: pnpm run hub:intelligence-shorthand-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"

      - name: Migration OS close (G8550)
        run: pnpm run hub:migration-os-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"

      - name: WISP + web-LLM unified POC (G8310)
        run: pnpm run hub:wisp-web-llm-poc-close-smoke
        env:
          CHRYSALIS_WEB_LLM_TRAJECTORY: "1"
          CHRYSALIS_POC_SKIP_BUILD: "1"

      - name: WISP complete demo close (G8330)
        run: pnpm run hub:wisp-complete-demo-close-smoke

      - name: WISP CWL pipeline artifact gate
        run: pnpm run ci:wisp-cwl-pipeline
